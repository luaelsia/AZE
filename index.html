<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>넌센스 퀴즈</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffe9a8">
<meta name="description" content="아이와 함께 푸는 한국 넌센스 퀴즈 268문제. 난이도 4단계, 시간 제한 없음.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AZE">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root{
    --bg1:#ffe9a8; --bg2:#ffc7d9; --bg3:#b6e5ff;
    --card:#fffdf7; --ink:#3b3226; --sub:#8a7c68;
    --line:#f0e2c6;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; padding:24px 16px 60px;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:var(--ink);
    background:linear-gradient(140deg,var(--bg1),var(--bg2) 45%,var(--bg3));
    background-attachment:fixed;
    display:flex; flex-direction:column; align-items:center;
    -webkit-tap-highlight-color:transparent;
  }
  h1{
    font-size:clamp(28px,7vw,44px); margin:8px 0 4px; text-align:center;
    text-shadow:0 3px 0 #fff;
  }
  .tagline{color:#6d5f4c; margin:0 0 22px; font-size:16px; text-align:center}
  .wrap{width:100%; max-width:640px}
  .card{
    background:var(--card); border-radius:24px; padding:28px 24px;
    box-shadow:0 12px 30px rgba(120,90,40,.18);
  }
  .hide{display:none !important}

  /* 난이도 선택 */
  .pick-title{font-size:20px; margin:0 0 4px; text-align:center}
  .pick-sub{font-size:14px; color:var(--sub); margin:0 0 20px; text-align:center}
  .levels{display:grid; gap:14px}
  .level{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    border:3px solid var(--line); border-radius:20px; background:#fff;
    padding:16px 18px; cursor:pointer; font:inherit; color:inherit;
    transition:transform .12s, border-color .12s, box-shadow .12s;
  }
  .level:hover{transform:translateY(-2px); border-color:#ffce4d; box-shadow:0 8px 18px rgba(0,0,0,.08)}
  .level.clear{border-color:#8fd888; background:#f4fff2}
  .level .emoji{font-size:34px; line-height:1}
  .level .txt{flex:1; min-width:0}
  .level b{display:block; font-size:19px; margin-bottom:3px}
  .level .desc{display:block; font-size:13.5px; color:var(--sub); line-height:1.45}
  .level .cnt{font-size:12.5px; color:#a7987f; white-space:nowrap; text-align:right; line-height:1.5}
  .bar{height:7px; border-radius:99px; background:#f0e6d3; margin-top:8px; overflow:hidden}
  .bar > i{display:block; height:100%; background:#ffbf3d; border-radius:99px; transition:width .3s}
  .level.clear .bar > i{background:#5cba54}

  /* 문제 화면 */
  .topbar{display:flex; align-items:center; gap:10px; margin-bottom:6px}
  .badge{background:#ffe08a; border-radius:999px; padding:6px 14px; font-size:14px; font-weight:700}
  .count{margin-left:auto; font-size:14px; color:var(--sub)}
  .qnum{color:#c99a2e; font-weight:800; font-size:15px; letter-spacing:.5px; margin-top:14px}
  .q{
    font-size:clamp(22px,5.2vw,30px); line-height:1.5; font-weight:700;
    margin:10px 0 26px; word-break:keep-all;
  }
  .answer{
    background:#eafbe7; border:3px dashed #9fdc95; border-radius:18px;
    padding:20px; text-align:center; margin-bottom:8px;
  }
  .answer .label{font-size:13px; color:#5c8a53; font-weight:700; margin-bottom:6px}
  .answer .text{font-size:clamp(20px,5vw,28px); font-weight:800; color:#2f6b28; word-break:keep-all}
  .clearmsg{
    background:#fff5d6; border:2px solid #ffd76a; border-radius:16px;
    padding:14px; text-align:center; font-size:15px; line-height:1.6; margin-top:16px;
  }
  button.big{
    width:100%; border:0; border-radius:18px; padding:18px 10px;
    font:inherit; font-size:19px; font-weight:800; cursor:pointer; color:#fff;
    transition:transform .1s, filter .1s;
  }
  button.big:hover{filter:brightness(1.06)}
  button.big:active{transform:translateY(2px)}
  .b-show{background:#ff9f45}
  .b-next{background:#4bbf7a}
  .mainbtn{margin-top:40px}
  .subbtns{display:flex; gap:10px; margin-top:16px}
  button.sub{
    flex:1; background:#fff; color:var(--sub); border:2px solid var(--line);
    border-radius:16px; padding:14px 8px; font:inherit; font-size:14.5px;
    font-weight:600; cursor:pointer;
  }
  button.sub:active{transform:translateY(2px)}
  .reset{border-color:#f3c9c9; color:#c46a6a}

  /* 푼 문제 목록 */
  .list-head{display:flex; align-items:center; gap:10px; margin-bottom:16px}
  .list-head h2{font-size:19px; margin:0}
  .empty{color:var(--sub); text-align:center; padding:30px 0; line-height:1.7}
  ol.solved{margin:0; padding-left:22px}
  ol.solved li{padding:11px 0; border-bottom:1px solid #f3ecdd; line-height:1.5}
  ol.solved li:last-child{border-bottom:0}
  ol.solved .sq{font-weight:600; word-break:keep-all}
  ol.solved .sa{color:#2f6b28; font-weight:700; font-size:14.5px; margin-top:3px; word-break:keep-all}

  footer{margin-top:22px; font-size:12.5px; color:#7d6f5c; text-align:center; line-height:1.7}
</style>
</head>
<body>

<h1>🤪 넌센스 퀴즈</h1>
<p class="tagline">시간 제한 없어요. 천천히 생각하고 답을 맞춰보세요!</p>

<div class="wrap">

  <!-- 난이도 선택 -->
  <div class="card" id="screen-home">
    <p class="pick-title">난이도를 골라주세요</p>
    <p class="pick-sub">아이와 함께라면 <b>말랑말랑</b>부터 시작해보세요 😊</p>
    <div class="levels" id="levels"></div>
  </div>

  <!-- 퀴즈 -->
  <div class="card hide" id="screen-quiz">
    <div class="topbar">
      <span class="badge" id="lvBadge">😄 말랑말랑</span>
      <span class="count" id="counter"></span>
    </div>
    <div class="bar"><i id="barFill" style="width:0%"></i></div>

    <div class="qnum">Q.</div>
    <div class="q" id="question"></div>

    <div class="answer hide" id="answerBox">
      <div class="label">정답</div>
      <div class="text" id="answerText"></div>
    </div>

    <div class="clearmsg hide" id="clearMsg"></div>

    <div class="mainbtn">
      <button class="big b-show" id="btnShow">정답 보기 👀</button>
      <button class="big b-next hide" id="btnNext">다음 문제 ➡️</button>
    </div>

    <div class="subbtns">
      <button class="sub" id="btnList">📒 푼 문제 보기</button>
      <button class="sub" id="btnHome">⬅️ 난이도 고르기</button>
    </div>
  </div>

  <!-- 푼 문제 목록 -->
  <div class="card hide" id="screen-list">
    <div class="list-head">
      <h2 id="listTitle">푼 문제</h2>
      <span class="count" id="listCount"></span>
    </div>
    <div id="listBody"></div>
    <div class="subbtns">
      <button class="sub" id="btnBackQuiz">⬅️ 퀴즈로 돌아가기</button>
      <button class="sub reset" id="btnReset">이 난이도 기록 지우기</button>
    </div>
  </div>

  <footer>
    문제 출처: 인터넷에서 널리 쓰이는 넌센스 퀴즈 모음<br>
    (나무위키, 수수께끼 모음 블로그, 아재개그 모음 등에서 수집, 어린이용으로 선별)
  </footer>
</div>

const KEY = "nonsense-quiz-progress-v2";
const $ = id => document.getElementById(id);

let progress = load();
let cur = {level:null, idx:-1};

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    const o = raw ? JSON.parse(raw) : {};
    const out = {};
    Object.keys(QUIZ).forEach(k => out[k] = Array.isArray(o[k]) ? o[k] : []);
    return out;
  }catch(e){
    const out = {}; Object.keys(QUIZ).forEach(k => out[k] = []); return out;
  }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(progress)); }catch(e){}
}
function solvedSet(level){ return new Set(progress[level]); }
function isClear(level){ return solvedSet(level).size >= QUIZ[level].length; }

/* ---------- 홈 화면 ---------- */
function renderHome(){
  const box = $("levels");
  box.innerHTML = "";
  Object.keys(LEVELS).forEach(key=>{
    const L = LEVELS[key], total = QUIZ[key].length, done = solvedSet(key).size;
    const pct = Math.round(done/total*100);
    const b = document.createElement("button");
    b.className = "level" + (done>=total ? " clear" : "");
    b.innerHTML =
      `<span class="emoji">${L.emoji}</span>
       <span class="txt">
         <b>${L.name}${done>=total ? " 🏆" : ""}</b>
         <span class="desc">${L.desc}</span>
         <span class="bar"><i style="width:${pct}%"></i></span>
       </span>
       <span class="cnt">${done} / ${total}<br>${done>=total ? "올클리어!" : "푼 문제"}</span>`;
    b.onclick = ()=>start(key);
    box.appendChild(b);
  });
}

/* ---------- 퀴즈 ---------- */
function start(level){
  cur.level = level;
  cur.idx = -1;
  $("lvBadge").textContent = LEVELS[level].emoji + " " + LEVELS[level].name;
  show("screen-quiz");
  pickNext();
}

function pickNext(){
  const level = cur.level, total = QUIZ[level].length;
  const done = solvedSet(level);
  let pool = [];
  for(let i=0;i<total;i++) if(!done.has(i)) pool.push(i);

  if(pool.length === 0){
    // 올클리어 후에는 전체에서 랜덤 (직전 문제만 피함)
    pool = [];
    for(let i=0;i<total;i++) if(i !== cur.idx) pool.push(i);
  }
  cur.idx = pool[Math.floor(Math.random()*pool.length)];
  render();
}

function render(){
  const level = cur.level, total = QUIZ[level].length;
  const done = solvedSet(level).size;
  const [q,a] = QUIZ[level][cur.idx];

  $("question").textContent = q;
  $("answerText").textContent = a;
  $("answerBox").classList.add("hide");
  $("btnShow").classList.remove("hide");
  $("btnNext").classList.add("hide");
  $("clearMsg").classList.add("hide");
  $("counter").textContent = `푼 문제 ${done} / ${total}`;
  $("barFill").style.width = Math.round(done/total*100) + "%";
  window.scrollTo({top:0, behavior:"smooth"});
}

$("btnShow").onclick = ()=>{
  const level = cur.level;
  const wasClear = isClear(level);
  if(!progress[level].includes(cur.idx)){
    progress[level].push(cur.idx);
    save();
  }
  const done = solvedSet(level).size, total = QUIZ[level].length;
  $("counter").textContent = `푼 문제 ${done} / ${total}`;
  $("barFill").style.width = Math.round(done/total*100) + "%";

  $("answerBox").classList.remove("hide");
  $("btnShow").classList.add("hide");
  $("btnNext").classList.remove("hide");

  if(!wasClear && isClear(level)){
    $("clearMsg").innerHTML =
      `🎉 <b>${LEVELS[level].name} 올클리어!</b><br>` +
      `${total}문제를 모두 풀었어요. 이제부터는 문제가 랜덤으로 다시 나옵니다.`;
    $("clearMsg").classList.remove("hide");
  }
};

$("btnNext").onclick = pickNext;

/* ---------- 푼 문제 목록 ---------- */
function renderList(){
  const level = cur.level, list = QUIZ[level];
  const ids = progress[level].slice();
  $("listTitle").textContent = `${LEVELS[level].emoji} ${LEVELS[level].name} 푼 문제`;
  $("listCount").textContent = `${ids.length} / ${list.length}`;
  const body = $("listBody");
  if(ids.length === 0){
    body.innerHTML = `<div class="empty">아직 푼 문제가 없어요.<br>정답을 보면 여기에 쌓입니다 📒</div>`;
    return;
  }
  const ol = document.createElement("ol");
  ol.className = "solved";
  ids.forEach(i=>{
    const [q,a] = list[i];
    const li = document.createElement("li");
    li.innerHTML = `<div class="sq">${q}</div><div class="sa">-> ${a}</div>`;
    ol.appendChild(li);
  });
  body.innerHTML = "";
  body.appendChild(ol);
}

/* ---------- 화면 전환 ---------- */
function show(id){
  ["screen-home","screen-quiz","screen-list"].forEach(s=>{
    $(s).classList.toggle("hide", s !== id);
  });
  window.scrollTo({top:0, behavior:"smooth"});
}

$("btnList").onclick = ()=>{ renderList(); show("screen-list"); };
$("btnBackQuiz").onclick = ()=> show("screen-quiz");
$("btnHome").onclick = ()=>{ renderHome(); show("screen-home"); };
$("btnReset").onclick = ()=>{
  if(confirm(`'${LEVELS[cur.level].name}' 난이도의 푼 문제 기록을 모두 지울까요?`)){
    progress[cur.level] = [];
    save();
    renderList();
    render();
  }
};

renderHome();

/* ---------- 서비스 워커 (오프라인 실행) ---------- */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("service-worker.js").catch(()=>{});
  });
}
